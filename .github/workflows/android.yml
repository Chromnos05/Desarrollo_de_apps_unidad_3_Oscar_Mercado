name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Pruebas y compilación del APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest assembleDebug 2>&1 | tee build.log

      - name: Mostrar errores de compilación
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|Could not" -A2 build.log | head -60 | while IFS= read -r linea; do
            echo "::error::${linea}"
          done

      - name: Guardar el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: MusicApp-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar el APK en la release "apk-latest"
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: MusicApp (APK más reciente)
          body: APK de depuración generado automáticamente desde la rama main.
          files: app/build/outputs/apk/debug/app-debug.apk
